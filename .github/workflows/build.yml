name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # إنشاء هيكلية مشروع أندرويد تلقائياً وتجميع الأكواد
      - name: Create Flutter Project Structure
        run: |
          mkdir temp_app
          cd temp_app
          flutter create . --org com.example.socialdownloader
          cp -f ../pubspec.yaml ./pubspec.yaml
          cp -f ../lib/main.dart ./lib/main.dart

      # إضافة أذونات التخزين والإنترنت في AndroidManifest.xml
      - name: Add Android Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' temp_app/android/app/src/main/AndroidManifest.xml

      # بناء ملف APK
      - name: Install Dependencies & Build APK
        run: |
          cd temp_app
          flutter pub get
          flutter build apk --release

      # رفع ملف الـ APK لتنزيله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialMediaDownloader-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
