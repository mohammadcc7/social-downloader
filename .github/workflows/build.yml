name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Base Project
        run: flutter create temp_app --org com.example.socialdownloader

      - name: Copy Custom Files
        run: |
          cp -f pubspec.yaml temp_app/pubspec.yaml
          cp -f lib/main.dart temp_app/lib/main.dart

      - name: Add Permissions to AndroidManifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' temp_app/android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        working-directory: temp_app
        run: flutter pub get

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialMediaDownloader-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
